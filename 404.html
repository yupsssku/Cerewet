<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — GamesNow</title>
<link rel="icon" href="https://reygenteng.github.io/gamesku/gamesnow.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#04091a;--s1:#08122a;--br:rgba(37,99,235,.18);--p:#2563eb;--pa:#60a5fa;--mu:#6b8cba;--tx:#f0f6ff}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Outfit',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px;
background-image:radial-gradient(ellipse 60% 40% at 50% 50%,rgba(37,99,235,.1) 0%,transparent 70%)}
.wrap{max-width:380px}
.num{font-size:6em;font-weight:800;background:linear-gradient(90deg,#3b82f6,#22d3ee);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:10px}
h1{font-size:1.3em;font-weight:700;margin-bottom:10px}
p{color:var(--mu);font-size:.9em;line-height:1.65;margin-bottom:28px}
.btn{display:inline-block;padding:13px 28px;background:var(--p);color:#fff;border-radius:12px;font-weight:700;font-size:.95em;transition:background .2s}
.btn:hover{background:#1d4ed8}
</style>
</head>
<body>
<div class="wrap">
  <div class="num">404</div>
  <h1>Halaman Tidak Ditemukan</h1>
  <p>Halaman yang kamu cari tidak ada atau sudah dipindahkan.</p>
  <a href="/" class="btn">← Kembali ke Beranda</a>
</div>
</body>
</html>
